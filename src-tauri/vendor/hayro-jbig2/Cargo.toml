[package]
name = "hayro-jbig2"
version = "0.3.0"
edition = "2024"
description = "A memory-safe, pure-Rust JBIG2 decoder (vendored from LaurenzV/hayro, MAX_INSTANCES raised)."
license = "Apache-2.0 OR MIT"

[lib]
name = "hayro_jbig2"
path = "src/lib.rs"

[features]
default = ["std", "simd"]
# The upstream `image` feature pulls the image-crate Bitmap integration, which
# we don't use (we drive the Decoder trait directly). Dropped in this vendored
# copy to avoid pulling the image crate transitively.
image = []
simd = ["dep:fearless_simd", "std"]
std = []

[dependencies]
# Vendored path dep so both crates move together. Upstream pins 0.3.
hayro-ccitt = { path = "../hayro-ccitt", default-features = false }
fearless_simd = { version = "0.4.0", optional = true }
