[package]
name = "kraken-engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "kraken_engine"
path = "src/lib.rs"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
ndarray = "0.16"
image = "0.25"
imageproc = { version = "0.25", default-features = false }
geo = "0.29"
anyhow = "1"
log = "0.4"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"

# Apple's Accelerate framework (vDSP/BNNS) gives ~1.15x faster matmul on
# macOS via hand-tuned NEON kernels. Only linked on Apple Silicon macOS —
# other platforms fall back to the pure-Rust `gemm` crate, which works
# everywhere but is slower.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { version = "0.11", features = ["accelerate"] }
